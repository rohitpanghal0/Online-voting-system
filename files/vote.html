{% extends "base.html" %}
{% block content %}
<h2>{{ election.title }}</h2>
<form method="post">
  {% for c in candidates %}
    <label>
      <input type="radio" name="candidate_id" value="{{ c.id }}" required>
      {{ c.name }} ({{ c.position }})
    </label><br>
  {% endfor %}
  <button class="btn btn-primary mt-3" type="submit">Cast Vote</button>
</form>
{% endblock %}
