<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Online Voting System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-3">
  <a class="navbar-brand" href="/">Online Voting</a>
  <div>
    {% if session.user_id %}
      {% if session.role == 'admin' %}<a class="btn btn-sm btn-light" href="/admin">Admin</a>{% endif %}
      <a class="btn btn-sm btn-outline-light" href="/logout">Logout</a>
    {% else %}
      <a class="btn btn-sm btn-outline-light" href="/login">Login</a>
      <a class="btn btn-sm btn-light" href="/register">Register</a>
    {% endif %}
  </div>
</nav>
<div class="container mt-4">
  {% with messages = get_flashed_messages() %}
    {% for m in messages %}<div class="alert alert-info">{{ m }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</div>
</body>
</html>
