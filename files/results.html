{% extends "base.html" %}
{% block content %}
<h2>Results: {{ election.title }}</h2>
<table class="table">
  <tr><th>Candidate</th><th>Position</th><th>Votes</th></tr>
  {% for r in rows %}
  <tr><td>{{ r.name }}</td><td>{{ r.position }}</td><td>{{ r.total }}</td></tr>
  {% endfor %}
</table>
<a href="/admin">Back</a>
{% endblock %}
