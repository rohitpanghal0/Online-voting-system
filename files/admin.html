{% extends "base.html" %}
{% block content %}
<h2>Admin Panel</h2>

<h5>Create Election</h5>
<form method="post" class="mb-4">
  <input type="hidden" name="action" value="new_election">
  <input class="form-control mb-2" name="title" placeholder="Election title" required>
  <button class="btn btn-primary">Create</button>
</form>

<h5>Add Candidate</h5>
<form method="post" class="mb-4">
  <input type="hidden" name="action" value="add_candidate">
  <select class="form-select mb-2" name="election_id" required>
    {% for e in elections %}<option value="{{ e.id }}">{{ e.title }}</option>{% endfor %}
  </select>
  <input class="form-control mb-2" name="name" placeholder="Candidate name" required>
  <input class="form-control mb-2" name="position" placeholder="Position">
  <button class="btn btn-primary">Add</button>
</form>

<h5>Elections</h5>
<table class="table">
  <tr><th>Title</th><th>Status</th><th>Actions</th></tr>
  {% for e in elections %}
  <tr>
    <td>{{ e.title }}</td>
    <td>{{ 'Open' if e.is_open else 'Closed' }}</td>
    <td>
      <form method="post" class="d-inline">
        <input type="hidden" name="action" value="toggle">
        <input type="hidden" name="election_id" value="{{ e.id }}">
        <button class="btn btn-sm btn-warning">{{ 'Close' if e.is_open else 'Open' }}</button>
      </form>
      <a class="btn btn-sm btn-info" href="/results/{{ e.id }}">Results</a>
    </td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
